name: Sync data and deploy

on:
  schedule:
    - cron: "0 21 * * *"  # 06:00 KST = 21:00 UTC, daily
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync SharePoint -> raw_data/
        env:
          # Set EITHER GRAPH_CLIENT_SECRET (Application perm) OR MSAL_CACHE_B64
          # (Delegated, minted by tools/auth_setup.py). The sync script picks
          # whichever is present.
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID || '9b247088-5afb-4622-9c5e-b5f27142761d' }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID || '19cab1f5-21f4-44df-8ac6-96d6ca595203' }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          MSAL_CACHE_B64: ${{ secrets.MSAL_CACHE_B64 }}
          SP_SITE_HOSTNAME: ${{ vars.SP_SITE_HOSTNAME || 'startruckkorea.sharepoint.com' }}
          SP_SITE_PATH: ${{ vars.SP_SITE_PATH || '/sites/STK-PMM' }}
          SP_FOLDER_PATH: ${{ vars.SP_FOLDER_PATH || 'mbtruck-cvdata' }}
        run: python tools/sharepoint_sync.py --out raw_data

      - name: Build JSON aggregates
        run: python tools/build_site.py --raw raw_data --out site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
