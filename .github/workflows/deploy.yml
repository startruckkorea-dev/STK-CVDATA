name: Deploy site only

# For deploying static asset changes (HTML/CSS/JS) without re-syncing data.
# Falls back to whatever JSON the previous sync run published — useful when
# iterating on the front-end.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/data/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore last published JSON (best effort)
        run: |
          # site/data/*.json is gitignored. Pull from the previous Pages artifact
          # if available, otherwise leave empty (pages will surface a warning).
          mkdir -p site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
