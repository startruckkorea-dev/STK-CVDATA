<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" role="img"
     aria-label="트랙터">
  <!-- Tractor unit, 6x4 — sleeper cab with a roof deflector, bare fifth wheel
       over the tandem. Cab geometry, wheel size and ground line are shared
       with seg-cargo / seg-tipper so the three tiles read as one set. -->
  <g fill="none" stroke="#3c4650" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 84 H232" stroke="#c9d1d9" />
    <!-- chassis -->
    <path d="M78 58 H190 M78 64 H190 M190 58 V64" />
    <!-- fifth wheel -->
    <path d="M112 52 H168 L174 58 H106 Z" fill="#fff" />
    <!-- wheels, then the bodywork over them -->
    <g fill="#fff">
      <circle cx="44" cy="71" r="13" /><circle cx="126" cy="71" r="13" />
      <circle cx="160" cy="71" r="13" />
    </g>
    <circle cx="44" cy="71" r="5" /><circle cx="126" cy="71" r="5" />
    <circle cx="160" cy="71" r="5" />
    <!-- cab -->
    <path d="M16 64 H31 A13 13 0 0 1 57 64 H78 V16 H26 L16 40 Z" fill="#fff" />
    <path d="M30 16 C46 6 66 6 78 12 V16" fill="#fff" />
    <path d="M20 38 L30 20 H48 V38 Z" />
    <path d="M52 20 V64" />
    <path d="M56 21 H72 V38 H56 Z" />
    <path d="M60 44 H66" />
    <path d="M16 54 H24" />
    <path d="M18 24 H12 M12 19 V31" />
  </g>
</svg>
