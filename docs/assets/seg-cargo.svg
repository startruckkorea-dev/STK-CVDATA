<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" role="img"
     aria-label="카고">
  <!-- Rigid with a dry box body — the same cab and wheels as seg-tractor,
       so the silhouette alone tells the two segments apart. -->
  <g fill="none" stroke="#3c4650" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 84 H232" stroke="#c9d1d9" />
    <!-- chassis + rear underrun bar -->
    <path d="M78 58 H216 M78 64 H210 M214 58 V72 M208 72 H220" />
    <!-- box body -->
    <path d="M84 14 H216 V54 H84 Z" fill="#fff" />
    <path d="M84 20 H216 M120 20 V54 M156 20 V54 M192 20 V54" />
    <!-- fuel tank -->
    <path d="M104 58 H136 V70 H104 Z" fill="#fff" />
    <!-- wheels -->
    <g fill="#fff">
      <circle cx="44" cy="71" r="13" /><circle cx="176" cy="71" r="13" />
    </g>
    <circle cx="44" cy="71" r="5" /><circle cx="176" cy="71" r="5" />
    <!-- cab -->
    <path d="M16 64 H31 A13 13 0 0 1 57 64 H80 V16 H26 L16 40 Z" fill="#fff" />
    <path d="M20 38 L30 20 H48 V38 Z" />
    <path d="M52 20 V64" />
    <path d="M56 21 H72 V38 H56 Z" />
    <path d="M60 44 H66" />
    <path d="M16 54 H24" />
    <path d="M18 24 H12 M12 19 V31" />
  </g>
</svg>
