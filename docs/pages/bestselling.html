<!doctype html>
<html lang="ko" data-site-root="..">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-t="nav_bestselling">베스트셀링 모델 · 한국 상용차 시장 리포트</title>
  <link rel="icon" href="../assets/mb-star.svg" type="image/svg+xml" />
  <link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/favicon-180.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../vendor/plotly-2.35.2.min.js" charset="utf-8" defer></script>
  <script src="../vendor/msal-browser.min.js" defer></script>
</head>
<body>

<!-- Painted before any script runs (the vendor bundles are deferred), so a
     cold first visit shows this instead of a blank page while ~4.8MB of
     Plotly + MSAL comes down. Taken away by js/loading.js. Hardcoded Korean:
     i18n has not loaded this early, same as the login screen. -->
<div id="app-loading" class="app-loading" role="status" aria-live="polite">
  <div class="al-card">
    <div class="al-spin"></div>
    <div class="al-msg" id="app-loading-msg">불러오는 중…</div>
    <div class="al-hint">처음 접속하시는 경우 자료를 내려받느라<br />20~30초 정도 걸릴 수 있습니다.</div>
  </div>
</div>
<div class="app">
  <aside class="sidebar"></aside>
  <main class="main">
    <h1 class="page-title" data-t="nav_bestselling">베스트셀링 모델</h1>
    <div class="page-sub">Top 모델 등록 대수 · 평균 취득가</div>

    <section class="filter-bar" id="filters"></section>

    <section class="section">
      <h2>Top 15 모델</h2>
      <div id="chart-top-models" class="chart"></div>
    </section>

    <section class="section">
      <h2>Top 15 모델 — 평균 취득가</h2>
      <div id="chart-avg-price" class="chart"></div>
    </section>

    <section class="section">
      <h2>상세 데이터</h2>
      <div id="model-table"></div>
    </section>
  </main>
</div>

<script type="module">
  import { requireAdmin } from "../js/auth.js";
  import { loadTranslations, applyT, t } from "../js/i18n.js";
  import { renderSidebar } from "../js/sidebar.js";
  import { renderFilters, yearOptions } from "../js/filters.js";
  import { loadManifest, loadCvData } from "../js/data.js";
  import { horizontalBar } from "../js/charts.js";
  import { fmtNum } from "../js/format.js";
  import { getState, subscribe } from "../js/state.js";

  (async () => {
    if (!(await requireAdmin())) return;
    await loadTranslations();
    renderSidebar(window.location.pathname);
    applyT();
    try {
      const manifest = await loadManifest();
      const years = manifest.cv_years || [];
      if (!years.length) {
        document.querySelector(".main").insertAdjacentHTML("afterbegin",
          `<div class="banner warn">${t("no_data")} (CV_DATA)</div>`); return;
      }
      renderFilters(document.getElementById("filters"), [
        { key: "year", label: "filter_year", options: yearOptions(years), default: years[0] },
      ], render);
      subscribe(render); render();
    } catch (e) {
      document.querySelector(".main").insertAdjacentHTML("afterbegin",
        `<div class="banner error">${e.message}</div>`);
    }
  })();

  async function render() {
    const s = getState();
    const manifest = await loadManifest();
    const year = parseInt(s.year, 10) || manifest.cv_years[0];
    const data = await loadCvData(year);
    const rows = (data.bestselling || []).slice(0, 15);

    horizontalBar(document.getElementById("chart-top-models"), {
      categories: rows.map(r => `${r.제작사} ${r.모델상세}`),
      values: rows.map(r => r.count),
    });

    const priced = rows.filter(r => r.avg_price > 0)
      .sort((a, b) => b.avg_price - a.avg_price);
    horizontalBar(document.getElementById("chart-avg-price"), {
      categories: priced.map(r => `${r.제작사} ${r.모델상세}`),
      values: priced.map(r => r.avg_price),
    });

    const tbl = `
      <table class="data">
        <thead><tr><th class="label">제작사</th><th class="label">모델</th><th>등록</th><th>평균 취득가(만원)</th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr><td class="label">${r.제작사}</td><td class="label">${r.모델상세}</td>
                <td class="num">${fmtNum(r.count)}</td>
                <td class="num">${fmtNum(r.avg_price)}</td></tr>`).join("")}
        </tbody>
      </table>`;
    document.getElementById("model-table").innerHTML = tbl;
  }
</script>
</body>
</html>
