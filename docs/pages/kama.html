<!doctype html>
<html lang="ko" data-site-root="..">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STK CV Market Intelligence</title>
  <link rel="icon" href="../assets/mb-star.svg" type="image/svg+xml" />
  <link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/favicon-180.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../vendor/plotly-2.35.2.min.js" charset="utf-8" defer></script>
  <script src="../vendor/msal-browser.min.js" defer></script>
</head>
<body>

<!-- Painted before any script runs (the vendor bundles are deferred), so a
     cold first visit shows this instead of a blank page while ~4.8MB of
     Plotly + MSAL comes down. Taken away by js/loading.js. Hardcoded Korean:
     i18n has not loaded this early, same as the login screen. -->
<div id="app-loading" class="app-loading" role="status" aria-live="polite">
  <div class="al-card">
    <div class="al-spin"></div>
    <div class="al-msg" id="app-loading-msg">불러오는 중…</div>
    <div class="al-hint">처음 접속하시는 경우 자료를 내려받느라<br />20~30초 정도 걸릴 수 있습니다.</div>
  </div>
</div>
<div class="app">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div class="exec-title-row">
        <h1 class="page-title" data-t="nav_kama">KAMA 국내 상용</h1>
        <div class="page-sub" data-t="kama_sub">현대 · 타타대우 월별 등록 + SoM</div>
        <div class="exec-period">
          <div class="now" id="period-now"></div>
          <div class="vs" id="period-vs"></div>
        </div>
      </div>

      <section class="filter-bar" id="filters"></section>

      <div id="kpi-row"></div>
    </div>

    <section class="section">
      <h2 data-t="kama_sec_sales">국내 상용차 판매</h2>
      <div id="chart-sales" class="chart"></div>
    </section>

    <section class="section">
      <h2 data-t="kama_sec_segment">세그먼트별 시장 분석</h2>
      <div id="segment-table" class="table-scroll"></div>
    </section>

    <section class="section">
      <h2 data-t="kama_sec_share">국내 브랜드 점유율</h2>
      <div id="chart-share" class="chart"></div>
    </section>

    <section class="section">
      <h2 data-t="kama_sec_brand">브랜드 비교</h2>
      <div id="chart-brand" class="chart"></div>
    </section>

  </main>
</div>

<script type="module">
  import { requireLogin } from "../js/auth.js";
  import { loadTranslations, applyT, t, tdata } from "../js/i18n.js";
  import { renderSidebar } from "../js/sidebar.js";
  import { renderFilters, syncFilters, yearOptions, monthOptions,
           brandOptions, segmentOptions } from "../js/filters.js";
  import { loadManifest, loadKama } from "../js/data.js";
  import { groupedBar, stackedBar, comboBarLine,
           SEGMENT_TILE_COLORS, TOKEN } from "../js/charts.js";
  import { fmtNum, fmtPct, calcYoY, deltaSpan, kpiGroups, MONTH_NUM } from "../js/format.js";
  import { getState, subscribe } from "../js/state.js";

  const MONTHS = [...Array(12).keys()].map(i => `M${String(i+1).padStart(2,"0")}`);
  // Every KAMA segment: the sidebar's three first, under its labels, then the
  // two it leaves out, under the segment names the filter tiles use.
  const SEGMENTS = [["Tractor", "nav_seg_tractor"], ["Rigid", "nav_seg_cargo"],
                    ["Tipper", "nav_seg_tipper"], ["Mixer"], ["EV"]];
  const segLabel = ([seg, key]) => (key ? t(key) : tdata(seg, "segment"));

  // Keys as the KAMA sheets spell them; what the reader sees comes from the
  // brand enum, so 현대 / 타타대우 turn into Hyundai / Tata Daewoo with the
  // language toggle. `brand_short` holds the marks the dense charts use.
  const BRANDS = ["Hyundai", "Tata Daewoo"];
  const name = (b) => tdata(b, "brand");
  const short = (b) => tdata(b, "brand_short");
  // The report's own pastel pair — kept identical across every chart here.
  const KAMA_COLOR = { Hyundai: "#6cbfd9", "Tata Daewoo": "#f2914d" };
  const TOTAL_LINE = TOKEN.deepTeal;
  const PY_LINE = TOKEN.mint;
  // Tiles need more punch than the chart pastels to read as a selected state.
  const KAMA_TILE = { ALL: TOKEN.deepTeal, Hyundai: "#1f7fa8", "Tata Daewoo": "#d9702c" };

  (async () => {
    if (!(await requireLogin())) return;
    await loadTranslations();
    renderSidebar(window.location.pathname);
    applyT();
    try {
      const manifest = await loadManifest();
      const years = manifest.kama_years || [];
      if (!years.length) {
        document.querySelector(".main").insertAdjacentHTML("afterbegin",
          `<div class="banner warn">${t("no_data")} (KAMA)</div>`); return;
      }
      renderFilters(document.getElementById("filters"), [
        { key: "year", label: "filter_year", options: yearOptions(years), default: years[0] },
        { key: "month", label: "filter_month", options: monthOptions(), default: "YTD" },
        { key: "brand", label: "filter_brand", as: "tiles", colors: KAMA_TILE,
          options: brandOptions(BRANDS, true), default: "ALL" },
        { key: "segment", label: "filter_segment", as: "tiles", colors: SEGMENT_TILE_COLORS,
          tkind: "segment",
          options: segmentOptions(["Rigid","Tractor","Tipper","Mixer","EV"]), default: "ALL" },
      ], render);
      subscribe(render);
      document.addEventListener("langchange", render);
      render();
    } catch (e) {
      document.querySelector(".main").insertAdjacentHTML("afterbegin",
        `<div class="banner error">${e.message}</div>`);
    }
  })();

  async function render() {
    const s = { ...getState() };
    syncFilters();
    const manifest = await loadManifest();
    const year = parseInt(s.year, 10) || manifest.kama_years[0];
    const data = await loadKama(year);
    // Previous year drives the YoY tiles and the dotted comparison line.
    let py = null;
    try { py = await loadKama(year - 1); } catch (e) { py = null; }

    const seg = s.segment && s.segment !== "ALL" ? s.segment : null;
    // The brand tiles highlight a brand in the table and charts; null = 전체.
    const sel = s.brand && s.brand !== "ALL" ? s.brand : null;

    const rowOf = (d, b) => (seg
      ? (d && d.by_brand_seg[b] && d.by_brand_seg[b][seg])
      : (d && d.by_brand[b])) || {};
    const monthlyVals = (d, b) => MONTHS.map(m => rowOf(d, b)[m] ?? 0);

    // ---- monthly series, shared by every chart below --------------------
    const byBrand = {}, byBrandPy = {};
    for (const b of BRANDS) {
      byBrand[b] = monthlyVals(data, b);
      byBrandPy[b] = py ? monthlyVals(py, b) : MONTHS.map(() => 0);
    }
    const totalMonthly = MONTHS.map((_, i) =>
      BRANDS.reduce((a, b) => a + byBrand[b][i], 0));
    const totalMonthlyPy = MONTHS.map((_, i) =>
      BRANDS.reduce((a, b) => a + byBrandPy[b][i], 0));
    // Stop the lines at the last month that has data instead of letting them
    // plunge to zero across the rest of the year.
    const lastMonth = totalMonthly.reduce((last, v, i) => (v > 0 ? i + 1 : last), 0);
    const trim = (vals) => vals.map((v, i) => (i < lastMonth ? v : null));

    // The stored YTD field spans a whole year, so comparing it against a
    // part-year would report a collapse that never happened. Everything
    // aggregated here sums the same months on both sides.
    const monthIdx = !s.month || s.month === "YTD" ? lastMonth : parseInt(s.month, 10);

    // Same stamp as 시장 개요. Taken from the unfiltered brand totals so a
    // segment with no sales in the latest month doesn't make the data look older.
    const dataLast = MONTHS.reduce((last, m, i) =>
      (BRANDS.some(b => ((data.by_brand[b] || {})[m] ?? 0) > 0) ? i + 1 : last), 0);
    const stampMonth = Math.min(monthIdx || dataLast, dataLast);
    document.getElementById("period-now").textContent = dataLast
      ? `${year}.${String(stampMonth).padStart(2, "0")} YTD` : `${year}`;
    document.getElementById("period-vs").textContent = t("exec_vs_prev", { year: year - 1 });
    const through = (vals) => vals.slice(0, monthIdx).reduce((a, v) => a + v, 0);
    const cyOf = (b) => through(byBrand[b]);
    const pyOf = (b) => (py ? through(byBrandPy[b]) : 0);

    const total = BRANDS.reduce((a, b) => a + cyOf(b), 0);
    const totalPy = BRANDS.reduce((a, b) => a + pyOf(b), 0);

    // The single month the filter points at (the latest month under YTD),
    // against the same month last year.
    const mthOf = (b) => byBrand[b][monthIdx - 1] || 0;
    const mthPyOf = (b) => (py ? byBrandPy[b][monthIdx - 1] || 0 : 0);

    renderKpis({ total, totalPy, cyOf, pyOf, mthOf, mthPyOf, monthIdx, sel });
    renderSales(byBrand, totalMonthly, totalMonthlyPy, trim, sel, year, py);
    renderSegments(data, py, stampMonth, sel);
    renderShare(byBrand, totalMonthly, lastMonth);

    const label = monthIdx === lastMonth ? "YTD" : `~${monthIdx}월`;
    groupedBar(document.getElementById("chart-brand"), {
      categories: BRANDS.map(name),
      series: [
        { name: `${year} ${label}`, values: BRANDS.map(cyOf), color: TOTAL_LINE },
        ...(py ? [{ name: `${year - 1} ${label}`, values: BRANDS.map(pyOf), color: PY_LINE }] : []),
      ],
    });

  }

  /**
   * One row per segment through the same months on both sides: its market,
   * its weight among all five segments (so the column adds up to 100%), YoY, and each brand's share with
   * the move against last year. Ignores the segment filter — it is the split.
   */
  function renderSegments(data, py, upTo, sel) {
    const sumUpTo = (row) => MONTHS.slice(0, upTo).reduce((a, m) => a + ((row || {})[m] ?? 0), 0);
    const unitsOf = (d, b, seg) => (d ? sumUpTo(seg ? (d.by_brand_seg[b] || {})[seg] : d.by_brand[b]) : 0);
    const pct = (a, b) => (b ? (a / b) * 100 : 0);
    const signed = (v) => `${v > 0 ? "+" : ""}${(Math.round(v * 10) / 10).toFixed(1)}`;
    const dir = (v) => (v === null || Math.abs(v) < 0.05 ? "" : v > 0 ? "up" : "down");
    const hasPy = !!py && BRANDS.some(b => unitsOf(py, b) > 0);

    const total = SEGMENTS.reduce((a, [seg]) =>
      a + BRANDS.reduce((x, b) => x + unitsOf(data, b, seg), 0), 0);
    const rows = SEGMENTS.map((entry) => {
      const [seg] = entry;
      const cy = Object.fromEntries(BRANDS.map(b => [b, unitsOf(data, b, seg)]));
      const pv = Object.fromEntries(BRANDS.map(b => [b, unitsOf(py, b, seg)]));
      const mkt = BRANDS.reduce((a, b) => a + cy[b], 0);
      const mktPy = BRANDS.reduce((a, b) => a + pv[b], 0);
      const yoy = hasPy ? calcYoY(mkt, mktPy) : null;
      const brandCells = BRANDS.map(b => {
        const som = pct(cy[b], mkt);
        const pp = hasPy && mktPy ? som - pct(pv[b], mktPy) : null;
        const hl = b === sel ? " highlight" : "";
        return `<td class="${hl}">${fmtNum(cy[b])}
                  <small class="of-market">${fmtPct(som)}</small></td>
                <td class="${pp === null ? "" : dir(pp)}${hl}">${pp === null ? "-" : `${signed(pp)}pp`}</td>`;
      }).join("");
      return `<tr>
        <td>${segLabel(entry)}</td>
        <td>${fmtNum(mkt)} <small class="of-market">${fmtPct(pct(mkt, total))}</small></td>
        <td class="${yoy === null ? "" : dir(yoy)}">${yoy === null ? "-" : `${signed(yoy)}%`}</td>
        ${brandCells}
      </tr>`;
    }).join("");

    const el = document.getElementById("segment-table");
    el.innerHTML = `
      <table class="pulse pulse-lg">
        <thead><tr>
          <th>${t("filter_segment")}</th>
          <th>${t("col_market_units")}</th>
          <th>YoY</th>
          ${BRANDS.map(b => `<th>${name(b)} (${t("col_share")})</th><th>${t("col_share_delta")}</th>`).join("")}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  /**
   * Two groups of the same shape — 전체 then one tile per brand — the first
   * through the selected month (YTD), the second for that month alone.
   */
  function renderKpis({ total, totalPy, cyOf, pyOf, mthOf, mthPyOf, monthIdx, sel }) {
    const tiles = (tot, totPy, of, pyOf, suffix) => {
      const cards = [`
        <div class="kpi-card stack total${sel === null ? " active" : ""}">
          <div class="title">${t("filter_all")}${suffix}</div>
          <div class="value">${fmtNum(tot)}</div>
          <div class="delta">${deltaSpan(calcYoY(tot, totPy))} <small>YoY</small></div>
        </div>`];
      for (const b of BRANDS) {
        const cy = of(b);
        const share = tot ? (cy / tot) * 100 : 0;
        cards.push(`
          <div class="kpi-card stack${sel === b ? " active" : ""}">
            <div class="title">${name(b)}${suffix}</div>
            <div class="value">${fmtNum(cy)}</div>
            <div class="delta">${deltaSpan(calcYoY(cy, pyOf(b)))} <small>YoY · ${fmtPct(share)}</small></div>
          </div>`);
      }
      return cards;
    };
    const mthTotal = BRANDS.reduce((a, b) => a + mthOf(b), 0);
    const mthTotalPy = BRANDS.reduce((a, b) => a + mthPyOf(b), 0);
    const mo = monthIdx ? ` (${monthIdx}${t("month_suffix")})` : "";

    // 시장 모멘텀: the year to date against the same months last year, as on
    // the overview and segment pages.
    const mv = calcYoY(total, totalPy);
    const mcls = mv === null ? "" : mv > 0 ? "up" : mv < 0 ? "down" : "";
    const mark = mcls === "up" ? "▲ " : mcls === "down" ? "▼ " : "";
    const momentum = `
      <div class="kpi-card stack">
        <div class="title">${t("exec_kpi_momentum")}</div>
        <div class="value">${mv === null ? "-" : `${mv > 0 ? "+" : ""}${fmtPct(mv)}`}</div>
        <div class="delta"><span class="${mcls}">${mv === null ? "-" :
          `${mark}${mv >= 0 ? t("exec_yoy_growth") : t("exec_yoy_decline")}`}</span></div>
      </div>`;

    document.getElementById("kpi-row").innerHTML = kpiGroups(
      [...tiles(total, totalPy, cyOf, pyOf, ""), momentum],
      tiles(mthTotal, mthTotalPy, mthOf, mthPyOf, mo),
      "kpi-row");
  }

  /**
   * Monthly volume per brand as grouped bars, with this year's and last year's
   * market totals overlaid as lines on the same unit axis.
   */
  function renderSales(byBrand, totalMonthly, totalMonthlyPy, trim, sel, year, py) {
    const shown = sel ? [sel] : BRANDS;
    comboBarLine(document.getElementById("chart-sales"), {
      x: MONTH_NUM,
      bars: shown.map(b => ({
        name: short(b), values: trim(byBrand[b]), color: KAMA_COLOR[b],
      })),
      lines: [
        { name: `${year}`, values: trim(totalMonthly), color: TOTAL_LINE,
          axis: "y", valueKind: "int", width: 2, symbol: "square", markerSize: 8 },
        ...(py ? [{ name: `${year - 1}`, values: totalMonthlyPy, color: TOKEN.mint,
          axis: "y", valueKind: "int", dash: "dot", width: 1.5,
          textposition: "bottom center" }] : []),
      ],
      yLabel: "units",
      height: 400,
      labelSize: 16,
    });
  }

  /** 100% share per month plus a highlighted YTD column on the right. */
  function renderShare(byBrand, totalMonthly, lastMonth) {
    const cats = [...MONTH_NUM, "YTD"];
    const ytdTotal = totalMonthly.reduce((a, v) => a + v, 0);
    const series = BRANDS.map(b => {
      const vals = MONTHS.map((_, i) =>
        i >= lastMonth || !totalMonthly[i] ? null : (byBrand[b][i] / totalMonthly[i]) * 100);
      const bYtd = byBrand[b].reduce((a, v) => a + v, 0);
      vals.push(ytdTotal ? (bYtd / ytdTotal) * 100 : null);
      return { name: short(b), values: vals, color: KAMA_COLOR[b] };
    });
    stackedBar(document.getElementById("chart-share"), {
      categories: cats,
      series,
      valueKind: "pct1",
      height: 400,
      labelSize: 17,
      yaxis: { range: [0, 100], ticksuffix: "%", tickvals: [0, 50, 100] },
      // The YTD column is a summary, not another month — call it out.
      shapes: [{
        type: "rect", xref: "x", yref: "paper",
        x0: cats.length - 1.5, x1: cats.length - 0.5, y0: 0, y1: 1,
        fillcolor: TOKEN.amber, opacity: 0.14, line: { width: 0 }, layer: "below",
      }],
    });
  }
</script>
</body>
</html>
