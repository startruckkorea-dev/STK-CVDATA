<!doctype html>
<html lang="ko" data-site-root="..">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-t="nav_seg_cargo">카고 · 한국 상용차 시장 리포트</title>
  <link rel="icon" href="../assets/mb-star.svg" type="image/svg+xml" />
  <link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/favicon-180.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../vendor/plotly-2.35.2.min.js" charset="utf-8" defer></script>
  <script src="../vendor/msal-browser.min.js" defer></script>
</head>
<body>

<!-- Painted before any script runs (the vendor bundles are deferred), so a
     cold first visit shows this instead of a blank page while ~4.8MB of
     Plotly + MSAL comes down. Taken away by js/loading.js. Hardcoded Korean:
     i18n has not loaded this early, same as the login screen. -->
<div id="app-loading" class="app-loading" role="status" aria-live="polite">
  <div class="al-card">
    <div class="al-spin"></div>
    <div class="al-msg" id="app-loading-msg">불러오는 중…</div>
    <div class="al-hint">처음 접속하시는 경우 자료를 내려받느라<br />20~30초 정도 걸릴 수 있습니다.</div>
  </div>
</div>
<div class="app">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <h1 class="page-title">
        <span data-t="seg_page_title">세그먼트별 상세 분석</span>
        <span class="seg-scope" id="seg-scope"></span>
      </h1>
      <div class="page-sub" id="page-sub"></div>

      <section class="filter-bar" id="filters"></section>

      <div id="kpi-row" class="kpi-row"></div>
    </div>

    <!-- The brand scorecard and its reading lead the page: it is the summary
         management asks for first. The table is sized to fit its column, so
         the whole row is read without a sideways scroll. -->
    <div class="exec-grid">
      <div class="exec-card w9">
        <h3 id="title-brand-table"></h3>
        <div id="brand-table"></div>
      </div>
      <div class="exec-card w3">
        <h3 id="title-insight"></h3>
        <div class="insights" id="insight-list"></div>
      </div>
    </div>

    <!-- Tractor only: the horsepower rating lives in the tractor sheets alone,
         so segment-page.js hides this row on the other two pages. -->
    <div class="exec-grid" id="hp-row" hidden>
      <div class="exec-card w12">
        <h3 id="title-hp-points"></h3>
        <div id="hp-points" class="chart"></div>
      </div>
    </div>

    <div class="exec-grid">
      <div class="exec-card w5">
        <h3 id="title-brand-ytd"></h3>
        <div id="chart-brand-ytd" class="chart"></div>
      </div>
      <div class="exec-card w7">
        <h3 id="title-monthly"></h3>
        <div id="chart-monthly" class="chart"></div>
      </div>
    </div>

    <p class="page-foot" data-t="seg_footnote">
      * MoM : 전월 대비, YoY : 전년 동기 대비, pp : 퍼센트 포인트 · Source: KAIDA (수입차협회)
    </p>
  </main>
</div>

<script type="module">
  import { initSegmentPage } from "../js/segment-page.js";
  initSegmentPage({ segment: "Rigid" }).catch(e => {
    console.error(e);
    document.querySelector(".main").insertAdjacentHTML("afterbegin",
      `<div class="banner error">${e.message}</div>`);
  });
</script>
</body>
</html>
