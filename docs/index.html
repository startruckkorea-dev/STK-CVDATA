<!doctype html>
<html lang="ko" data-site-root=".">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-t="nav_exec_overview">시장 개요 · 한국 상용차 시장 리포트</title>
  <link rel="icon" href="assets/mb-star.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="vendor/plotly-2.35.2.min.js" charset="utf-8" defer></script>
  <script src="vendor/msal-browser.min.js" defer></script>
</head>
<body>

<!-- Painted before any script runs (the vendor bundles are deferred), so a
     cold first visit shows this instead of a blank page while ~4.8MB of
     Plotly + MSAL comes down. Taken away by js/loading.js. Hardcoded Korean:
     i18n has not loaded this early, same as the login screen. -->
<div id="app-loading" class="app-loading" role="status" aria-live="polite">
  <div class="al-card">
    <div class="al-spin"></div>
    <div class="al-msg" id="app-loading-msg">불러오는 중…</div>
    <div class="al-hint">처음 접속하시는 경우 자료를 내려받느라<br />20~30초 정도 걸릴 수 있습니다.</div>
  </div>
</div>

<div class="app">
  <aside class="sidebar"></aside>

  <main class="main">
    <div class="page-head">
      <div class="exec-title-row">
        <h1 class="page-title" data-t="exec_title">Executive Market Intelligence</h1>
        <div class="page-sub" data-t="exec_subtitle">한국 수입 상용차 시장</div>
        <div class="exec-period">
          <div class="now" id="period-now"></div>
          <div class="vs" id="period-vs"></div>
        </div>
      </div>

      <section class="filter-bar" id="filters"></section>

      <div id="kpi-row" class="exec-kpis"></div>
    </div>

    <!-- WHAT'S HAPPENING — the market's shape, who holds it, who moved. -->
    <div class="exec-grid">
      <div class="exec-card w4">
        <h3 id="title-trend"></h3>
        <div id="chart-trend" class="chart"></div>
      </div>
      <div class="exec-card w5">
        <h3 id="title-ranking"></h3>
        <div id="rank-table"></div>
      </div>
      <div class="exec-card w3">
        <h3 id="title-share-change"></h3>
        <div id="chart-share-change" class="chart"></div>
      </div>
    </div>

    <!-- WHY, WHERE, SO WHAT — where the units went, which segment carried
         them, and the three sentences that follow from both. -->
    <div class="exec-grid">
      <div class="exec-card w4">
        <h3 id="title-contribution"></h3>
        <div id="chart-contribution" class="chart"></div>
        <div class="exec-foot" id="contribution-foot"></div>
      </div>
      <div class="exec-card w5">
        <h3 id="title-pulse"></h3>
        <div id="pulse-table"></div>
      </div>
      <div class="exec-card w3">
        <h3 id="title-insight"></h3>
        <div class="insights" id="insight-list"></div>
      </div>
    </div>

    <!-- HOW THE YEAR IS TRACKING — the same glide path the insight page
         carries, at management width. -->
    <div class="exec-grid">
      <div class="exec-card w12">
        <h3 id="title-glide"></h3>
        <div id="chart-glide" class="chart"></div>
      </div>
    </div>

    <section class="section">
      <h2 data-t="exec_quick_links">상세 분석 바로가기</h2>
      <div class="quick-links" id="quick-links"></div>
    </section>
  </main>
</div>

<script type="module">
  import { requireLogin } from "./js/auth.js";
  import { loadTranslations, applyT, t, tdata } from "./js/i18n.js";
  import { renderSidebar } from "./js/sidebar.js";
  import { renderFilters, syncFilters, yearOptions, monthOptions } from "./js/filters.js";
  import { loadManifest, loadKaidaPair } from "./js/data.js";
  import { trendLine, divergingBarH, waterfall, comboBarLine, BRAND_TILE_COLORS, TOKEN } from "./js/charts.js";
  import { MONTHS, MONTHS_KR, fmtNum, fmtPct, calcYoY } from "./js/format.js";
  import { getState, subscribe } from "./js/state.js";

  const BRAND_ORDER = ["MB", "Volvo", "Scania", "MAN", "IVECO"];
  const SEGMENT_ORDER = ["Tractor", "Rigid", "Tipper"];
  // Spelled out on this page only: management reads the maker's name, the
  // analysis pages keep the short ticker their tables are sized for.
  const BRAND_LABEL = { MB: "Mercedes-Benz" };
  const POS = "#1f883d", NEG = "#d4122a";

  let _years = [];

  async function bootstrap() {
    const account = await requireLogin();
    if (!account) return;
    await loadTranslations();
    renderSidebar(window.location.pathname);
    applyT();

    let manifest;
    try {
      manifest = await loadManifest();
    } catch (e) {
      return banner("error", e.message);
    }
    _years = manifest.kaida_years || [];
    if (!_years.length) return banner("warn", `${t("no_data")} (KAIDA)`);

    // Year and cut-off month only: every figure on this page is YTD through
    // the chosen month, so a "당월" mode would give the tiles two meanings.
    renderFilters(document.getElementById("filters"), [
      { key: "year", label: "filter_year", options: yearOptions(_years), default: _years[0] },
      { key: "month", label: "filter_month", options: monthOptions(), default: "YTD" },
    ], render);

    document.addEventListener("langchange", render);
    subscribe(render);
    render();
  }

  function banner(kind, msg) {
    document.querySelector(".main").insertAdjacentHTML("afterbegin",
      `<div class="banner ${kind}">${msg}</div>`);
  }

  // ---- accessors ------------------------------------------------------------

  function zeros() { const o = {}; for (const m of MONTHS) o[m] = 0; o.Total = 0; return o; }
  const sumThrough = (row, last) => {
    let n = 0; for (let i = 0; i < last; i++) n += row[MONTHS[i]] || 0; return n;
  };
  const brandRow = (d, b) => (d && d.by_brand[b]) || zeros();
  const segRow = (d, s) => (d && d.by_segment[s]) || zeros();
  const brandSegRow = (d, b, s) => (d && d.by_brand_seg[b] && d.by_brand_seg[b][s]) || zeros();
  const totalRow = (d) => (d && d.monthly_totals) || zeros();
  const months = (row) => MONTHS.map(m => row[m] || 0);
  const trim = (vals, last) => vals.map((v, i) => (i < last ? v : null));
  const pct = (a, b) => (b ? (a / b) * 100 : 0);
  const signed = (v, digits = 1) => {
    if (v === null || v === undefined || Number.isNaN(v)) return "-";
    const p = 10 ** digits;
    return `${v > 0 ? "+" : ""}${(Math.round(v * p) / p).toFixed(digits)}`;
  };

  /** pp delta with the up / down mark and colour the ranking table uses. */
  function ppSpan(v, suffix = "pp") {
    if (v === null || v === undefined || Number.isNaN(v)) return `<span class="pp flat">-</span>`;
    const cls = v > 0.05 ? "up" : v < -0.05 ? "down" : "flat";
    const mark = v > 0.05 ? "▲" : v < -0.05 ? "▼" : "·";
    return `<span class="pp ${cls}">${mark} ${Math.abs(Math.round(v * 10) / 10).toFixed(1)}${suffix}</span>`;
  }

  const brandInk = (b) => BRAND_TILE_COLORS[b] || TOKEN.teal;

  /** `hex` mixed toward white — the light end of a bar's fade. */
  function lighten(hex, amount) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex);
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    const mix = (c) => Math.round(c + (255 - c) * amount);
    const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(mix);
    return `rgb(${r},${g},${b})`;
  }

  const dir = (v) => {
    if (v === null || v === undefined || Number.isNaN(v) || Math.abs(v) < 0.05) return "";
    return v > 0 ? "up" : "down";
  };

  // ---- sparklines -----------------------------------------------------------
  // Inline SVG rather than four more Plotly instances: these carry no axis, no
  // hover and no legend, and four more plots would cost more to draw than the
  // whole rest of the page. Gradient ids have to be unique per tile — the four
  // sparks share one document.

  let _gradSeq = 0;

  /** Line with the ground under it shaded — the shape reads at a glance even
   *  where the line itself is only a few pixels tall. */
  function sparkLine(values, { w = 122, h = 40, color = "#1A3A82" } = {}) {
    const known = values.filter(v => v !== null && v !== undefined);
    if (known.length < 2) return "";
    const min = Math.min(...known), max = Math.max(...known);
    const span = max - min || 1;
    const pts = [];
    values.forEach((v, i) => {
      if (v === null || v === undefined) return;
      const x = (i / (values.length - 1)) * (w - 4) + 2;
      // Held off the floor and the ceiling so the fill never collapses to a
      // hairline at the series minimum.
      const y = h - 4 - ((v - min) / span) * (h - 10);
      pts.push([x, y]);
    });
    const [lx, ly] = pts[pts.length - 1];
    const line = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const area = `${pts[0][0].toFixed(1)},${h} ${line} ${lx.toFixed(1)},${h}`;
    const id = `spk${++_gradSeq}`;
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <defs>
        <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.22" />
          <stop offset="100%" stop-color="${color}" stop-opacity="0.02" />
        </linearGradient>
      </defs>
      <polygon fill="url(#${id})" points="${area}" />
      <polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"
                stroke-linecap="round" points="${line}" />
      <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.6" fill="${color}" />
    </svg>`;
  }

  /** Bars fading toward their tips, so a tall bar still reads as one mark. */
  function sparkBars(values, { w = 122, h = 40, color = "#1A3A82" } = {}) {
    const known = values.filter(v => v !== null && v !== undefined);
    if (!known.length) return "";
    const max = Math.max(...known, 1);
    const step = w / values.length;
    const bw = Math.max(2.5, step - 2.6);
    const id = `spk${++_gradSeq}`;
    const bars = values.map((v, i) => {
      if (!v) return "";
      const bh = Math.max(2, (v / max) * (h - 3));
      return `<rect x="${(i * step + (step - bw) / 2).toFixed(1)}" y="${(h - bh).toFixed(1)}"
                    width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.2"
                    fill="url(#${id})" />`;
    }).join("");
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <defs>
        <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.45" />
          <stop offset="100%" stop-color="${color}" stop-opacity="1" />
        </linearGradient>
      </defs>${bars}
    </svg>`;
  }

  // ---- render ---------------------------------------------------------------

  async function render() {
    const s = { month: "YTD", ...getState() };
    syncFilters();
    const year = parseInt(s.year, 10) || _years[0];

    let cur = null, prev = null;
    try {
      ({ cur, prev } = await loadKaidaPair(year));
    } catch (e) { console.error(e); }
    if (!cur) {
      document.getElementById("kpi-row").innerHTML = `<div class="banner warn">${t("no_data")}</div>`;
      return;
    }

    const last = cur.last_data_month || 12;
    // A month picked past the data would silently pad the YTD window with
    // months nobody has reported yet.
    const monthIdx = Math.min(s.month === "YTD" ? last : parseInt(s.month, 10) || last, last);
    const prevYear = prev ? prev.year : year - 1;

    document.getElementById("period-now").textContent =
      `${year}.${String(monthIdx).padStart(2, "0")} YTD`;
    document.getElementById("period-vs").textContent = t("exec_vs_prev", { year: prevYear });

    document.getElementById("title-trend").textContent = t("exec_trend");
    document.getElementById("title-ranking").textContent = t("exec_ranking");
    document.getElementById("title-share-change").textContent =
      t("exec_share_change", { year: prevYear });
    document.getElementById("title-contribution").textContent = t("exec_contribution");
    document.getElementById("title-pulse").textContent = t("exec_segment_pulse");
    document.getElementById("title-insight").textContent = t("exec_insight");

    const facts = readFacts(cur, prev, monthIdx);

    renderKpis(cur, prev, facts, monthIdx);
    renderTrend(cur, prev, monthIdx);
    renderRanking(facts);
    renderShareChange(facts);
    renderContribution(facts, year, prevYear);
    renderPulse(facts);
    renderInsights(facts);
    renderGlide(cur, prev, year, monthIdx);
    renderQuickLinks(year, s.month);
  }

  /**
   * MB volume by month against last year, with the cumulative share riding the
   * right axis. Same shape as the insight page's glide path, trimmed to the
   * month this page is reading and with no table under it.
   */
  function renderGlide(cur, prev, year, monthIdx) {
    document.getElementById("title-glide").textContent = `MB – ${year} SoM Glide path`;

    const mbCur = months(brandRow(cur, "MB"));
    const mbPrev = prev ? months(brandRow(prev, "MB")) : MONTHS.map(() => 0);
    const totCur = months(totalRow(cur));

    let cm = 0, ct = 0;
    const somYtd = mbCur.map((v, i) => {
      cm += v; ct += totCur[i];
      return ct ? (cm / ct) * 100 : 0;
    });

    comboBarLine(document.getElementById("chart-glide"), {
      x: MONTHS_KR,
      bars: [
        { name: `MB ${year}`, values: trim(mbCur, monthIdx), color: TOKEN.teal },
        { name: prev ? `MB ${prev.year}` : "PY", values: mbPrev, color: TOKEN.mint },
      ],
      lines: [
        { name: "YTD SoM", values: trim(somYtd, monthIdx), color: TOKEN.deepTeal, width: 3 },
      ],
      height: 320,
      yLabel: "units",
    });
  }

  /** Every number the six panels share, computed once against the same window. */
  function readFacts(cur, prev, monthIdx) {
    const total = sumThrough(totalRow(cur), monthIdx);
    const totalPrev = prev ? sumThrough(totalRow(prev), monthIdx) : 0;

    const brands = BRAND_ORDER.map(b => {
      const cy = sumThrough(brandRow(cur, b), monthIdx);
      const py = prev ? sumThrough(brandRow(prev, b), monthIdx) : 0;
      const share = pct(cy, total);
      return {
        brand: b, label: BRAND_LABEL[b] || b, cy, py,
        delta: cy - py,
        yoy: calcYoY(cy, py),
        share,
        pp: share - pct(py, totalPrev),
      };
    });
    const ranked = [...brands].sort((a, b) => b.cy - a.cy);

    const segments = SEGMENT_ORDER.map(seg => {
      const mkt = sumThrough(segRow(cur, seg), monthIdx);
      const mktPrev = prev ? sumThrough(segRow(prev, seg), monthIdx) : 0;
      const mb = sumThrough(brandSegRow(cur, "MB", seg), monthIdx);
      const mbPrev = prev ? sumThrough(brandSegRow(prev, "MB", seg), monthIdx) : 0;
      const som = pct(mb, mkt);
      return {
        seg, mkt, mb, som,
        yoy: calcYoY(mkt, mktPrev),
        delta: mkt - mktPrev,
        pp: som - pct(mbPrev, mktPrev),
      };
    });

    return {
      hasPrev: !!prev && totalPrev > 0,
      total, totalPrev,
      marketYoY: calcYoY(total, totalPrev),
      brands, ranked, segments,
      mb: brands.find(b => b.brand === "MB"),
      maxShare: Math.max(...brands.map(b => b.share), 1),
    };
  }

  // ---- KPI tiles ------------------------------------------------------------

  function kpiCard(title, value, unit, delta, deltaLabel, spark) {
    // Same up/down marks as ppSpan, so a tile and the ranking table read alike.
    const mark = delta.cls === "up" ? "▲ " : delta.cls === "down" ? "▼ " : "";
    return `
      <div class="exec-kpi">
        <div class="k-title">${title}</div>
        <div class="k-body">
          <div>
            <div class="k-value">${value}${unit ? `<small>${unit}</small>` : ""}</div>
            <div class="k-delta ${delta.cls}">${mark}${delta.text}${deltaLabel ? ` <small>${deltaLabel}</small>` : ""}</div>
          </div>
          ${spark}
        </div>
      </div>`;
  }

  function renderKpis(cur, prev, f, monthIdx) {
    const totMonths = trim(months(totalRow(cur)), monthIdx);
    const mbMonths = trim(months(brandRow(cur, "MB")), monthIdx);
    const totPrevMonths = prev ? months(totalRow(prev)) : null;

    // Cumulative SoM — the same YTD figure the tile prints, month by month,
    // so the spark ends exactly on the number above it.
    let cm = 0, ct = 0;
    const somPath = totMonths.map((v, i) => {
      if (v === null) return null;
      cm += mbMonths[i] || 0; ct += v;
      return ct ? (cm / ct) * 100 : 0;
    });

    // Momentum walks the same way: YTD-so-far against the same window of last
    // year, so the last point is the headline figure.
    let cc = 0, cp = 0;
    const momentumPath = totMonths.map((v, i) => {
      if (v === null || !totPrevMonths) return null;
      cc += v; cp += totPrevMonths[i] || 0;
      return cp ? ((cc - cp) / cp) * 100 : null;
    });

    const monthCur = totMonths[monthIdx - 1] || 0;
    const monthPrev = totPrevMonths ? totPrevMonths[monthIdx - 1] || 0 : 0;
    const monthYoY = calcYoY(monthCur, monthPrev);
    const monthLabel = `${t("kpi_month")} (${cur.year}.${String(monthIdx).padStart(2, "0")})`;

    document.getElementById("kpi-row").innerHTML = [
      kpiCard(
        t("exec_kpi_total"), fmtNum(f.total), t("exec_units"),
        { cls: dir(f.marketYoY), text: `${signed(f.marketYoY)}%` }, "YoY",
        sparkLine(totMonths, { color: "#1A3A82" })),
      kpiCard(
        monthLabel, fmtNum(monthCur), t("exec_units"),
        { cls: dir(monthYoY), text: monthYoY === null ? "-" : `${signed(monthYoY)}%` },
        monthYoY === null ? "" : "YoY",
        sparkBars(totMonths, { color: "#1A3A82" })),
      kpiCard(
        t("exec_kpi_som"), fmtPct(f.mb.share), "",
        { cls: dir(f.mb.pp), text: `${signed(f.mb.pp)}pp` }, "YoY",
        sparkLine(somPath, { color: "#231F20" })),
      kpiCard(
        t("exec_kpi_momentum"), `${signed(f.marketYoY)}%`, "",
        { cls: dir(f.marketYoY),
          text: f.marketYoY >= 0 ? t("exec_yoy_growth") : t("exec_yoy_decline") }, "",
        sparkLine(momentumPath, { color: "#1A3A82" })),
    ].join("");
  }

  // ---- charts ---------------------------------------------------------------

  function renderTrend(cur, prev, monthIdx) {
    const curMonths = trim(months(totalRow(cur)), monthIdx);
    const prevMonths = prev ? months(totalRow(prev)) : null;

    // 3-month moving average of the current year — the trend under the noise
    // of a market that books a few hundred units a month.
    const ma = curMonths.map((v, i) => {
      if (v === null || i < 2) return null;
      const w = curMonths.slice(i - 2, i + 1);
      return w.some(x => x === null) ? null : w.reduce((a, b) => a + b, 0) / 3;
    });

    trendLine(document.getElementById("chart-trend"), {
      x: MONTHS_KR,
      series: [
        ...(prevMonths ? [{ name: String(prev.year), values: prevMonths, color: "#b1b8c0", width: 2 }] : []),
        { name: String(cur.year), values: curMonths, color: "#1A3A82", width: 3,
          fill: "rgba(26,58,130,0.10)" },
        { name: `${t("exec_ma3")} (${cur.year})`, values: ma, color: "#1A3A82",
          width: 1.6, dash: "dot", markerSize: 0 },
      ],
      height: 240,
    });
  }

  function renderRanking(f) {
    document.getElementById("rank-table").innerHTML = `
      <table class="rank">
        <thead>
          <tr>
            <th data-t="filter_brand">Brand</th>
            <th class="num" data-t="col_units">Units</th>
            <th data-t="col_share">Share</th>
            <th class="num" data-t="col_vs_ly">vs LY</th>
          </tr>
        </thead>
        <tbody>
          ${f.ranked.map((r, i) => `
            <tr class="${r.brand === "MB" ? "mb" : ""}">
              <td class="brand"><span class="rk">${i + 1}</span> ${r.label}</td>
              <td class="num">${fmtNum(r.cy)}</td>
              <td><div class="bar" style="width:${(r.share / f.maxShare * 100).toFixed(1)}%;
                       --bar:${brandInk(r.brand)};--bar-soft:${lighten(brandInk(r.brand), 0.45)}"></div></td>
              <td class="num">${fmtPct(r.share)} ${f.hasPrev ? ppSpan(r.pp) : ""}</td>
            </tr>`).join("")}
        </tbody>
      </table>`;
    applyT(document.getElementById("rank-table"));
  }

  function renderShareChange(f) {
    const rows = [...f.brands].sort((a, b) => b.pp - a.pp);
    divergingBarH(document.getElementById("chart-share-change"), {
      categories: rows.map(r => r.label),
      values: rows.map(r => Math.round(r.pp * 10) / 10),
      height: 240,
      posColor: POS, negColor: NEG,
    });
  }

  function renderContribution(f, year, prevYear) {
    // Walked worst-first: the units the market lost, then the ones that
    // partly replaced them.
    const steps = [...f.brands].sort((a, b) => a.delta - b.delta)
      .map(r => ({ label: r.label, value: r.delta }));

    waterfall(document.getElementById("chart-contribution"), {
      startLabel: `YTD ${prevYear}`, startValue: f.totalPrev,
      endLabel: `YTD ${year}`, endValue: f.total,
      steps, height: 240, posColor: POS, negColor: NEG,
    });

    const change = f.total - f.totalPrev;
    document.getElementById("contribution-foot").innerHTML = f.hasPrev
      ? `<span class="cf-label">${t("exec_total_change")}</span>
         <span class="cf-value ${dir(change)}">${signed(change, 0)} ${t("exec_units")}
         (${signed(f.marketYoY)}%)</span>`
      : "";
  }

  /** Traffic light for a segment: MB gained share, gave a little back, or lost
   *  ground fast enough to need an answer. */
  function segSignal(pp) {
    if (pp > 0.05) return "good";
    if (pp > -1.5) return "warn";
    return "bad";
  }

  function renderPulse(f) {
    document.getElementById("pulse-table").innerHTML = `
      <table class="pulse">
        <thead>
          <tr>
            <th data-t="filter_segment">Segment</th>
            <th data-t="col_market_units">Market</th>
            <th>YoY</th>
            <th data-t="col_mb_som">MB SoM</th>
            <th data-t="col_share_delta">Δ Share</th>
            <th data-t="col_signal">Signal</th>
          </tr>
        </thead>
        <tbody>
          ${f.segments.map(r => `
            <tr>
              <td><a href="pages/segment.html?segment=${r.seg}">${tdata(r.seg, "segment")}</a></td>
              <td>${fmtNum(r.mkt)}</td>
              <td class="${dir(r.yoy)}">${r.yoy === null ? "-" : `${signed(r.yoy)}%`}</td>
              <td>${fmtPct(r.som)}</td>
              <td class="${dir(r.pp)}">${f.hasPrev ? `${signed(r.pp)}pp` : "-"}</td>
              <td><span class="signal ${segSignal(r.pp)}"></span></td>
            </tr>`).join("")}
        </tbody>
      </table>`;
    applyT(document.getElementById("pulse-table"));
  }

  // ---- executive insight ----------------------------------------------------
  // Three sentences, each read straight off the numbers above: how MB fared
  // against its own market, who took the share it lost, and which segment
  // moved the market. Nothing is claimed here that the panels do not show.

  function insightCard(tone, title, body) {
    return `<div class="insight">
      <span class="dot ${tone}"></span>
      <div><h4>${title}</h4><p>${body}</p></div>
    </div>`;
  }

  function renderInsights(f) {
    const el = document.getElementById("insight-list");
    if (!f.hasPrev) { el.innerHTML = `<p class="ql-sub">${t("no_data")}</p>`; return; }

    const out = [];

    // MB against the market it sits in — share only moves when the two grow
    // at different rates, so the gap is the whole story.
    const gap = f.mb.yoy === null || f.marketYoY === null ? null : f.mb.yoy - f.marketYoY;
    const under = gap !== null && gap < 0;
    out.push(insightCard(
      under ? "bad" : "good",
      t(under ? "exec_insight_mb_under_title" : "exec_insight_mb_over_title"),
      t("exec_insight_mb_body", {
        mb: `${signed(f.mb.yoy)}%`,
        mkt: `${signed(f.marketYoY)}%`,
        gap: signed(gap),
        som: signed(f.mb.pp),
      })));

    // Whoever took the most share — the counterpart to the line above.
    const gainer = [...f.brands].sort((a, b) => b.pp - a.pp)[0];
    if (gainer && gainer.pp > 0) {
      out.push(insightCard("good",
        t("exec_insight_gainer_title", { brand: gainer.label }),
        t("exec_insight_gainer_body", {
          brand: gainer.label,
          yoy: `${signed(gainer.yoy)}%`,
          pp: signed(gainer.pp),
        })));
    }

    // The segment that moved the market most, and how much of the total move
    // it accounts for.
    const change = f.total - f.totalPrev;
    const mover = [...f.segments].sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))[0];
    if (mover && change) {
      out.push(insightCard(
        mover.delta < 0 ? "warn" : "good",
        t("exec_insight_segment_title", { segment: tdata(mover.seg, "segment") }),
        t("exec_insight_segment_body", {
          segment: tdata(mover.seg, "segment"),
          change: signed(mover.delta, 0),
          share: fmtPct(Math.abs(mover.delta / change) * 100),
        })));
    }

    el.innerHTML = out.join("");
  }

  // ---- quick links ----------------------------------------------------------

  // Text only — the tiles are a short list of destinations, and a mark above
  // each name added weight without telling the reader anything the name did
  // not already say.
  function qlink(href, mark, name, sub) {
    return `<a class="qlink" href="${href}">
      <div class="ql-name">${name}</div>
      <div class="ql-sub">${sub}</div>
    </a>`;
  }

  function renderQuickLinks(year, month) {
    // Carry the period across, so a drill-down opens on the same window the
    // executive numbers were read from.
    const q = `?year=${year}&month=${month}`;
    document.getElementById("quick-links").innerHTML = [
      qlink(`pages/seg-tractor.html${q}`, "tractor", t("exec_link_tractor"), t("exec_link_seg_sub")),
      qlink(`pages/seg-cargo.html${q}`, "rigid", t("exec_link_rigid"), t("exec_link_seg_sub")),
      qlink(`pages/seg-tipper.html${q}`, "tipper", t("exec_link_tipper"), t("exec_link_seg_sub")),
      qlink(`pages/kama.html${q}`, "bars", t("nav_kama"), t("exec_link_brand_sub")),
      // No 베스트셀링 / 가격 분석 tile: those live under CV DATA, which is
      // still a test build and is hidden from read-grade accounts.
    ].join("");
  }

  bootstrap().catch(e => {
    console.error(e);
    banner("error", e.message);
  });
</script>
